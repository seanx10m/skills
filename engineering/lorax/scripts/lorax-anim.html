<style>
  html,body{margin:0;padding:0;width:100%;height:100%;background:#0b0a12;overflow:hidden;}
  canvas{position:fixed;left:0;top:0;display:block;
         image-rendering:pixelated;image-rendering:crisp-edges;image-rendering:-moz-crisp-edges;}
  #crt{position:fixed;inset:0;pointer-events:none;
       background:
         radial-gradient(ellipse at 50% 48%, rgba(0,0,0,0) 58%, rgba(0,0,0,.40) 100%),
         repeating-linear-gradient(to bottom, rgba(0,0,0,.13) 0 1px, rgba(0,0,0,0) 1px 3px);
       mix-blend-mode:multiply;}

  /* Chrome lives in the DOM, not the canvas: hit-testing and hover come free,
     and the render loop stays a pure function of the animation state. */
  #x{position:fixed;top:3px;right:3px;width:22px;height:22px;z-index:3;
     display:flex;align-items:center;justify-content:center;cursor:pointer;
     font:700 13px ui-monospace,Menlo,monospace;color:#ffe9a8;
     background:rgba(12,10,20,.55);border:1px solid rgba(255,233,168,.35);
     border-radius:3px;user-select:none;line-height:1;}
  #x:hover{background:#c2405a;color:#fff;border-color:#ffe9a8;}
  #bar{position:fixed;left:50%;bottom:6px;transform:translateX(-50%);z-index:3;
       display:none;gap:4px;}
  #bar.on{display:flex;}
  #bar button{cursor:pointer;padding:3px 9px;border-radius:3px;
        font:700 10px ui-monospace,Menlo,monospace;letter-spacing:.06em;
        color:#0b0a12;background:#ffe9a8;border:1px solid #8a6a2a;}
  #bar button:hover{background:#fff;}
  #panel{position:fixed;inset:0;z-index:2;display:none;overflow-y:auto;
         background:rgba(8,7,14,.97);color:#e8e2d0;
         font:11px/1.45 ui-monospace,Menlo,monospace;padding:6px 8px 22px;}
  #panel.on{display:block;}
  #panel h2{font-size:10px;letter-spacing:.10em;margin:6px 0 3px;color:#9a93a8;
            text-transform:uppercase;font-weight:700;}
  #panel .row{display:flex;gap:6px;padding:2px 0;border-bottom:1px solid rgba(255,255,255,.06);}
  #panel .nm{color:#fff;white-space:nowrap;}
  #panel .rs{color:#9a93a8;flex:1;text-align:right;}
  #panel .cut .nm{color:#ff8fa8;text-decoration:line-through;}
  #panel .kept .nm{color:#7ee0c0;}
</style>
<canvas id="c"></canvas><div id="crt"></div>

<script>
const REPO = /*__REPO__*/ "";
const TREES = /*__TREES__*/ [{"name": "mcp-surface-rewrite", "doomed": true, "reason": "PR #1963 merged - work is in main"}, {"name": "tag-picker", "doomed": true, "reason": "PR #1901 merged - work is in main"}, {"name": "triage-doc", "doomed": false, "reason": "PR #2057 still open"}, {"name": "resumable-upload-fixes", "doomed": false, "reason": "no PR - commits may exist only on this disk"}];

(function(){
'use strict';

/* ------------------------------------------------------------------ *
 *  LORAX  -  a round forest guardian prunes git worktrees.
 *  Every pixel is drawn here. No images, no fonts, no network.
 *  Original sprite work, not traced from anyone's artwork.
 * ------------------------------------------------------------------ */

var LOGW = 240, LOGH = 135, GROUND_Y = 108, PXS = 2;
var TAU = Math.PI * 2;

/* ---------------- tiny 5x7 pixel font ---------------- */
var FONT_SRC = {
'A':'01110,10001,10001,11111,10001,10001,10001',
'B':'11110,10001,10001,11110,10001,10001,11110',
'C':'01110,10001,10000,10000,10000,10001,01110',
'D':'11110,10001,10001,10001,10001,10001,11110',
'E':'11111,10000,10000,11110,10000,10000,11111',
'F':'11111,10000,10000,11110,10000,10000,10000',
'G':'01110,10001,10000,10111,10001,10001,01111',
'H':'10001,10001,10001,11111,10001,10001,10001',
'I':'11111,00100,00100,00100,00100,00100,11111',
'J':'00111,00010,00010,00010,00010,10010,01100',
'K':'10001,10010,10100,11000,10100,10010,10001',
'L':'10000,10000,10000,10000,10000,10000,11111',
'M':'10001,11011,10101,10101,10001,10001,10001',
'N':'10001,11001,10101,10011,10001,10001,10001',
'O':'01110,10001,10001,10001,10001,10001,01110',
'P':'11110,10001,10001,11110,10000,10000,10000',
'Q':'01110,10001,10001,10001,10101,10010,01101',
'R':'11110,10001,10001,11110,10100,10010,10001',
'S':'01111,10000,10000,01110,00001,00001,11110',
'T':'11111,00100,00100,00100,00100,00100,00100',
'U':'10001,10001,10001,10001,10001,10001,01110',
'V':'10001,10001,10001,10001,10001,01010,00100',
'W':'10001,10001,10001,10101,10101,11011,01010',
'X':'10001,10001,01010,00100,01010,10001,10001',
'Y':'10001,10001,01010,00100,00100,00100,00100',
'Z':'11111,00001,00010,00100,01000,10000,11111',
'0':'01110,10001,10011,10101,11001,10001,01110',
'1':'00100,01100,00100,00100,00100,00100,01110',
'2':'01110,10001,00001,00010,00100,01000,11111',
'3':'11111,00010,00100,00010,00001,10001,01110',
'4':'00010,00110,01010,10010,11111,00010,00010',
'5':'11111,10000,11110,00001,00001,10001,01110',
'6':'00110,01000,10000,11110,10001,10001,01110',
'7':'11111,00001,00010,00100,01000,01000,01000',
'8':'01110,10001,10001,01110,10001,10001,01110',
'9':'01110,10001,10001,01111,00001,00010,01100',
'-':'00000,00000,00000,11111,00000,00000,00000',
'_':'00000,00000,00000,00000,00000,00000,11111',
'.':'00000,00000,00000,00000,00000,01100,01100',
',':'00000,00000,00000,00000,01100,01100,01000',
'/':'00001,00001,00010,00100,01000,10000,10000',
'\\':'10000,10000,01000,00100,00010,00001,00001',
':':'00000,01100,01100,00000,01100,01100,00000',
'+':'00000,00100,00100,11111,00100,00100,00000',
'#':'01010,01010,11111,01010,11111,01010,01010',
'*':'00000,10101,01110,11111,01110,10101,00000',
'!':'00100,00100,00100,00100,00100,00000,00100',
'?':'01110,10001,00001,00010,00100,00000,00100',
'(':'00010,00100,01000,01000,01000,00100,00010',
')':'01000,00100,00010,00010,00010,00100,01000',
'[':'01110,01000,01000,01000,01000,01000,01110',
']':'01110,00010,00010,00010,00010,00010,01110',
'=':'00000,00000,11111,00000,11111,00000,00000',
'<':'00010,00100,01000,10000,01000,00100,00010',
'>':'01000,00100,00010,00001,00010,00100,01000',
"'":'00100,00100,00000,00000,00000,00000,00000',
'"':'01010,01010,00000,00000,00000,00000,00000',
'@':'01110,10001,10111,10101,10110,10000,01110',
'&':'01100,10010,10010,01100,10101,10010,01101',
'%':'11001,11010,00010,00100,01000,01011,10011',
'$':'00100,01111,10100,01110,00101,11110,00100'
};
var FONT = {};
for (var fk in FONT_SRC) FONT[fk] = FONT_SRC[fk].split(',');
FONT[' '] = ['00000','00000','00000','00000','00000','00000','00000'];
var GLYPH_UNKNOWN = ['11111','10001','10001','10001','10001','10001','11111'];

function glyph(ch){ return FONT[ch] || GLYPH_UNKNOWN; }
function textW(s, sc){ sc = sc || 1; return s.length ? (s.length * 6 - 1) * sc : 0; }

function drawText(c, s, x, y, col, sc){
  sc = sc || 1;
  c.fillStyle = col;
  for (var i = 0; i < s.length; i++){
    var g = glyph(s.charAt(i));
    var gx = x + i * 6 * sc;
    for (var r = 0; r < 7; r++){
      var row = g[r], run = 0;
      for (var b = 0; b <= 5; b++){
        var on = b < 5 && row.charAt(b) === '1';
        if (on) run++;
        else if (run){ c.fillRect(gx + (b - run) * sc, y + r * sc, run * sc, sc); run = 0; }
      }
    }
  }
}
function drawTextShadow(c, s, x, y, col, shadow, sc){
  drawText(c, s, x + 1, y + 1, shadow, sc);
  drawText(c, s, x, y, col, sc);
}

/* ---------------- misc helpers ---------------- */
function hashStr(s){
  var h = 2166136261;
  for (var i = 0; i < s.length; i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
function rngFrom(seed){
  var s = (seed >>> 0) || 12345;
  return function(){
    s ^= s << 13; s >>>= 0;
    s ^= s >>> 17;
    s ^= s << 5;  s >>>= 0;
    return s / 4294967296;
  };
}
function clamp(v, a, b){ return v < a ? a : (v > b ? b : v); }
function pxCircle(c, cx, cy, r, col){
  c.fillStyle = col;
  cx = Math.round(cx); cy = Math.round(cy); r = Math.round(r);
  for (var y = -r; y <= r; y++){
    var w = Math.floor(Math.sqrt(Math.max(0, r * r - y * y)));
    c.fillRect(cx - w, cy + y, 2 * w + 1, 1);
  }
}
function pxEllipse(c, cx, cy, rx, ry, col){
  c.fillStyle = col;
  cx = Math.round(cx); cy = Math.round(cy);
  ry = Math.max(1, Math.round(ry)); rx = Math.max(1, rx);
  for (var y = -ry; y <= ry; y++){
    var k = 1 - (y * y) / (ry * ry);
    var w = Math.floor(rx * Math.sqrt(Math.max(0, k)));
    c.fillRect(cx - w, cy + y, 2 * w + 1, 1);
  }
}

/* ---------------- sanitize incoming data ---------------- */
var trees = [];
(function(){
  var src = Array.isArray(TREES) ? TREES : [];
  for (var i = 0; i < src.length; i++){
    var raw = src[i] || {};
    var nm = (raw.name === undefined || raw.name === null) ? '' : String(raw.name);
    if (!nm) nm = 'worktree-' + (i + 1);
    trees.push({ name: nm, doomed: !!raw.doomed, state: 'up', fallT: 0, shake: 0,
                 saluted: false, puffGone: false, leafDrop: false, boom: false, idx: i });
  }
})();
var N_TOTAL   = trees.length;
var N_DOOMED  = trees.filter(function(t){ return t.doomed; }).length;
var N_SPARED  = N_TOTAL - N_DOOMED;

/* ---------------- name wrapping ---------------- */
var MAXCH = 14;
function wrapName(name){
  var raw = name.toUpperCase();
  if (raw.length <= MAXCH) return [raw];
  var parts = raw.split('-'), lines = [], cur = '';
  for (var i = 0; i < parts.length; i++){
    var seg = parts[i] + (i < parts.length - 1 ? '-' : '');
    if (!cur) cur = seg;
    else if (cur.length + seg.length <= MAXCH) cur += seg;
    else { lines.push(cur); cur = seg; }
    while (cur.length > MAXCH){ lines.push(cur.slice(0, MAXCH)); cur = cur.slice(MAXCH); }
  }
  if (cur) lines.push(cur);
  if (lines.length > 3){ lines = lines.slice(0, 3); var l = lines[2]; lines[2] = l.slice(0, MAXCH - 1) + '.'; }
  return lines;
}

/* ---------------- truffula palettes ---------------- *
 * puff = the fluffy crown. stripe = the candy-caned trunk.               */
var PUFFS = [
  { d:'#9E1155', m:'#FF4FA3', l:'#FFA9D6' },   /* hot pink   */
  { d:'#B94206', m:'#FF7C1B', l:'#FFBB63' },   /* orange     */
  { d:'#B58800', m:'#FFD62B', l:'#FFF190' },   /* yellow     */
  { d:'#0B6A72', m:'#22C7CF', l:'#8DF2F5' },   /* teal       */
  { d:'#6B1590', m:'#C244DA', l:'#EAA3F5' },   /* magenta    */
  { d:'#96143A', m:'#FF4D63', l:'#FFA3AC' },   /* coral red  */
  { d:'#3B7A0E', m:'#8ADB2B', l:'#CDF78F' },   /* lime       */
  { d:'#2E3AA8', m:'#6E7BEE', l:'#B7BEFF' }    /* violet     */
];
var STRIPES = [
  { a:'#F3EEE4', b:'#241D22' },   /* the classic black and white */
  { a:'#F3EEE4', b:'#241D22' },
  { a:'#FCEDF3', b:'#C13B79' },   /* candy pink    */
  { a:'#E9F7F7', b:'#1B7A81' },   /* candy teal    */
  { a:'#FFF3D9', b:'#AC5C0E' }    /* candy caramel */
];
var SIGN_DOOM = { bg:'#2A1C22', edge:'#E8663C', text:'#FFD9C7', post:'#7A4630' };
var SIGN_SAFE = { bg:'#12301F', edge:'#F2C14E', text:'#FFF4CE', post:'#6B5A2A' };
var BARK_EDGE = '#241A14';

/* ---------------- measure signs, lay the grove out ---------------- */
function measureTree(t){
  t.lines = wrapName(t.name);
  var lw = 0;
  for (var i = 0; i < t.lines.length; i++) lw = Math.max(lw, textW(t.lines[i]));
  t.plqW = lw + 10;
  t.plqH = t.lines.length * 8 - 1 + 8;
  t.pal    = PUFFS[hashStr(t.name + '#puff') % PUFFS.length];
  t.stripe = STRIPES[hashStr(t.name + '#bark') % STRIPES.length];
  t.sign   = t.doomed ? SIGN_DOOM : SIGN_SAFE;
}
var i2;
for (i2 = 0; i2 < trees.length; i2++) measureTree(trees[i2]);
var cursor = 96;
for (i2 = 0; i2 < trees.length; i2++){
  if (i2 > 0){
    var gap = Math.max(84, ((trees[i2 - 1].plqW + trees[i2].plqW) / 2 + 26) | 0);
    cursor += gap;
  }
  trees[i2].x = cursor;
}
var WORLD_END = (trees.length ? trees[trees.length - 1].x : 60) + 120;

var FINALE_X = WORLD_END + 10;   /* he performs just past the last stump */

/* ---------------- build one truffula ---------------- */
function buildTree(t){
  var r = rngFrom(hashStr(t.name) + t.idx * 7919);
  var avail = Math.max(34, GROUND_Y - 15);
  var H     = Math.round(avail * (0.76 + r() * 0.24));
  var R     = clamp(Math.round(H * 0.175), 6, 22);
  var amp   = clamp(Math.round(H * 0.115), 3, 11);
  var bend  = 2.0 + r() * 1.6;
  var ph0   = r() * TAU;
  var sw    = 3 + ((r() * 3) | 0);           /* stripe band height */

  var W  = (R + amp + 6) * 2;
  var px = W >> 1;
  var trunkTop = R + 2;
  var trunkH   = Math.max(6, H - trunkTop);
  var base0    = Math.sin(ph0);

  function curve(k){                          /* k = height above the base */
    var u = k / trunkH;
    return amp * (Math.sin(u * bend + ph0) - base0);
  }

  function paintTrunk(c, splinter){
    var k, y, xo, hw, cx, band, col;
    for (k = 0; k < trunkH; k++){
      y  = H - 1 - k;
      xo = curve(k);
      hw = k < 2 ? 3 : (k < 5 ? 2 : 1);
      cx = px + xo;
      band = (Math.floor(k / sw) % 2);
      col  = band ? t.stripe.a : t.stripe.b;
      c.fillStyle = BARK_EDGE;
      c.fillRect(Math.round(cx - hw - 1), y, hw * 2 + 3, 1);
      c.fillStyle = col;
      c.fillRect(Math.round(cx - hw), y, hw * 2 + 1, 1);
      if (band){ c.fillStyle = 'rgba(255,255,255,0.35)'; c.fillRect(Math.round(cx - hw), y, 1, 1); }
    }
    /* the ribbon a surveyor ties round a doomed trunk */
    if (t.doomed && trunkH > 16){
      var rk = Math.round(trunkH * 0.45);
      for (k = rk; k < rk + 2; k++){
        y = H - 1 - k; cx = px + curve(k);
        c.fillStyle = '#8E1A22'; c.fillRect(Math.round(cx - 3), y, 7, 1);
        c.fillStyle = '#E2453C'; c.fillRect(Math.round(cx - 2), y, 5, 1);
      }
      cx = px + curve(rk);
      c.fillStyle = '#C22E2E';
      c.fillRect(Math.round(cx + 3), H - 1 - rk + 1, 1, 3);
      c.fillRect(Math.round(cx + 4), H - 1 - rk + 2, 1, 3);
    }
    /* the chewed, splintered break the axe left behind */
    if (splinter){
      var sr = rngFrom(hashStr(t.name) + 4242);
      for (k = 0; k < 5; k++){
        y = H - 1 - k; cx = px + curve(k);
        c.fillStyle = '#E6D2AE';
        c.fillRect(Math.round(cx - 2 + ((sr() * 4) | 0)), y, 1, 1 + ((sr() * 2) | 0));
      }
      c.fillStyle = '#C9A97A';
      c.fillRect(Math.round(px + curve(0) - 3), H - 2, 7, 2);
    }
  }

  function paintPuff(c){
    var pcx = px + curve(trunkH), pcy = trunkTop;
    var nb = 11 + ((r() * 4) | 0), i, a, br;
    var bumps = [];
    for (i = 0; i < nb; i++){                     /* scalloped, tufty silhouette */
      a = (i / nb) * TAU + r() * 0.22;
      br = R * 0.30 + r() * R * 0.15;
      bumps.push([pcx + Math.cos(a) * R * 0.76, pcy + Math.sin(a) * R * 0.68, br]);
    }
    bumps.push([pcx, pcy, R * 0.78]);
    for (i = 0; i < bumps.length; i++) pxCircle(c, bumps[i][0], bumps[i][1], bumps[i][2] + 1, t.pal.d);
    for (i = 0; i < bumps.length; i++) pxCircle(c, bumps[i][0], bumps[i][1], bumps[i][2],     t.pal.m);
    /* underside: a crescent of shade hugging the lower rim, never a hole */
    for (i = 0; i <= 6; i++){
      a = 0.42 + (i / 6) * (Math.PI - 0.84);
      pxCircle(c, pcx + Math.cos(a) * R * 0.66, pcy + Math.sin(a) * R * 0.58, R * 0.22, t.pal.d);
    }
    /* highlight: a soft cluster up and to the left, not a pasted disc */
    pxCircle(c, pcx - R * 0.30, pcy - R * 0.36, R * 0.30, t.pal.l);
    pxCircle(c, pcx - R * 0.02, pcy - R * 0.48, R * 0.20, t.pal.l);
    pxCircle(c, pcx - R * 0.54, pcy - R * 0.10, R * 0.18, t.pal.l);
    /* fluff: single pixels standing off the silhouette */
    c.fillStyle = t.pal.l;
    for (i = 0; i < 18; i++){
      a = r() * TAU;
      var rr = R * (0.95 + r() * 0.22);
      c.fillRect(Math.round(pcx + Math.cos(a) * rr), Math.round(pcy + Math.sin(a) * rr * 0.9), 1, 1);
    }
    c.fillStyle = t.pal.d;
    for (i = 0; i < 10; i++){
      a = r() * TAU;
      var r2 = r() * R * 0.8;
      c.fillRect(Math.round(pcx + Math.cos(a) * r2), Math.round(pcy + Math.sin(a) * r2), 1, 1);
    }
    t.puffDX = pcx - px;
    t.puffDY = pcy;
  }

  var full = document.createElement('canvas');
  full.width = W; full.height = H;
  var fc = full.getContext('2d');
  fc.imageSmoothingEnabled = false;
  paintTrunk(fc, false);
  paintPuff(fc);

  var bare = document.createElement('canvas');
  bare.width = W; bare.height = H;
  var bc = bare.getContext('2d');
  bc.imageSmoothingEnabled = false;
  paintTrunk(bc, true);

  /* ---- the name sign, its own crisp sprite so it can fall alone ---- */
  var pw = t.plqW, ph = t.plqH, sg = t.sign, i3;
  var pc = document.createElement('canvas');
  pc.width = pw; pc.height = ph;
  var q = pc.getContext('2d');
  q.imageSmoothingEnabled = false;
  q.fillStyle = sg.edge; q.fillRect(0, 0, pw, ph);
  q.fillStyle = sg.bg;   q.fillRect(1, 1, pw - 2, ph - 2);
  q.fillStyle = 'rgba(255,255,255,0.10)'; q.fillRect(1, 1, pw - 2, 1);
  q.fillStyle = 'rgba(0,0,0,0.28)';       q.fillRect(2, ph - 3, pw - 4, 1);
  q.clearRect(0, 0, 1, 1); q.clearRect(pw - 1, 0, 1, 1);
  q.clearRect(0, ph - 1, 1, 1); q.clearRect(pw - 1, ph - 1, 1, 1);
  for (i3 = 0; i3 < t.lines.length; i3++){
    var lx = (pw - textW(t.lines[i3])) >> 1;
    drawText(q, t.lines[i3], lx, 4 + i3 * 8, sg.text, 1);
  }
  t.plq = pc;

  t.spr  = full;
  t.bare = bare;
  t.sprW = W; t.sprH = H;
  t.pivotX = px;
  t.pivotY = H - 2;                     /* the cut, two pixels off the dirt */
  t.puffCX = t.puffDX;                  /* relative to pivotX */
  t.puffCY = t.puffDY - t.pivotY;       /* relative to pivotY */
  t.R = R;
  t.H = H;
  /* the sign hangs off the trunk just under the crown */
  t.signDY = -(H - trunkTop - R - 4);
  if (t.signDY > -(t.plqH + 10)) t.signDY = -(t.plqH + 10);
}

var builtFor = -1;
function buildAll(){
  for (var i = 0; i < trees.length; i++) buildTree(trees[i]);
  builtFor = GROUND_Y;
}

/* ---------------- the guardian ---------------- *
 * Short, round, potato-shaped. Bright orange fur, an enormous drooping
 * yellow mustache that owns the face, bushy brows, tiny dark eyes,
 * stubby arms and legs. Drawn from scratch for this animation.          */
var GP = { '.': null,
  'K': '#3A1E0A',  /* outline      */
  'O': '#F27A1A',  /* fur mid      */
  'o': '#C4590C',  /* fur shade    */
  'L': '#FFA246',  /* fur light    */
  'Y': '#FFD84D',  /* mustache     */
  'y': '#D9A62C',  /* mustache shd */
  'W': '#FFF6E0',  /* glint        */
  'N': '#7A4A1E'   /* boot         */
};
var BODY = [
  '.........KKKKKKKK.........',
  '.......KKOLLLLLLOKK.......',
  '.....KKOLLOOOOOOLLOKK.....',
  '....KOOOOOOOOOOOOOOOOK....',
  '...KOOOOOOOOOOOOOOOOOOK...',
  '..KOYYYYYYOOOOOOYYYYYYOK..',
  '..KOYYYYYYYOOOOYYYYYYYOK..',

function drawRows(c, rows, x, y){

var SUB = [[0,0],[0.5,0],[0,0.5],[0.5,0.5]];

function drawRotPix(c, list, ox, oy, ang, sz){

/* ---------------- pacing ---------------- */
var speedMul  = clamp(Math.sqrt(Math.max(1, N_TOTAL) / 6), 1, 2.6);
var RUN_SPEED = 118 * speedMul;
var SWING_DUR = 0.46 / speedMul;
var N_SWINGS  = 2;
/* Valkyrie spin: he winds up, then whirls, axe out at full extension, and the
   blade bites once per revolution rather than once per deliberate chop. */
var SPIN_WIND = 0.22 / speedMul;   /* crouch and coil before the whirl */
var SPIN_REVS = 3;                 /* revolutions per tree */
var SPIN_DUR  = 0.30 / speedMul;   /* seconds per revolution */
var SPIN_OUT  = 0.20 / speedMul;   /* settle back to guard */
var FALL_DUR  = 0.66 / clamp(speedMul, 1, 1.7);
var SALUTE_DUR= 0.66 / speedMul;

var AXE_REST   =  0.85;   /* carried low, blade swinging by his boots */
var AXE_WIND   = -2.30;   /* anticipation, hauled back over the shoulder */
var AXE_STRIKE =  0.40;   /* buried in the trunk */
var AXE_OVER   =  0.95;   /* follow-through, past the cut */
var AXE_SALUTE = -1.57;   /* held straight up, well clear of the face */
var SWEEP = (function(){
  var d = AXE_STRIKE - AXE_WIND;
  while (d <= 0.1) d += TAU;
  return d;                               /* one clean arc: back, over the top, down */
})();

function angLerp(a, b, k){
  var d = b - a;
  while (d >  Math.PI) d -= TAU;
  while (d < -Math.PI) d += TAU;
  return a + d * k;
}
function smooth(u){ return u * u * (3 - 2 * u); }

/* ---------------- world state ---------------- */
var G = { x: 12, legDist: 0, axe: AXE_REST, lean: 0, sqx: 1, sqy: 1, hop: 0, spin: 0, fade: 1, face: 1, rot: 0, hopY: 0, balance: 0 };
var phase = 'run', curTree = -1, swing = 0, swingT = 0, struck = false, lastHit = -1;
var finT = 0, finLand = false, finPop = false, axeStuck = false, axeX = 0;
var FIN_THROW = 0.46, FIN_FLIP = 0.80, FIN_BAL = 1.5, FIN_BOW = 1.1;
var finBow = false, finX0 = 0, AXE_HANDLE_H = 15;
var summaryT = -1, saluteT = 0, timeAll = 0, shake = 0, doneSent = false;
/* Game feel: a combo that climbs while he keeps felling, a score, floating
   pop-ups, hitstop, and a shockwave. None of it is load-bearing - it exists so
   a prune reads as an accomplishment rather than a log line. */
var score = 0, combo = 0, comboT = 0, best = 0, freeze = 0, pops = [], rings = [];
var shakeDX = 0, shakeDY = 0, flash = 0;
function pop(x, y, text, col, big, fixed){
  pops.push({ x: x, y: y, t: 0, life: big ? 1.5 : 1.0, text: text, col: col, big: !!big, fixed: !!fixed });
}
function ring(x, y, col){ rings.push({ x: x, y: y, t: 0, life: 0.42, col: col }); }
function kick(mag, dx, dy){
  shake = Math.max(shake, mag);
  shakeDX = dx; shakeDY = dy;
  flash = Math.max(flash, Math.min(0.55, mag * 0.16));
  freeze = Math.max(freeze, 0.055 + mag * 0.012);   /* hitstop sells the weight */
}
var parts = [];
var cutCount = 0, keptCount = 0;

function nextDoomed(){
  for (var i = 0; i < trees.length; i++) if (trees[i].doomed && trees[i].state === 'up') return i;
  return -1;
}
function spawn(x, y, n, cols, spread, up, life, grav, drift, size){
  for (var i = 0; i < n; i++){
    parts.push({
      x: x, y: y,
      vx: (Math.random() - 0.5) * spread,
      vy: -Math.random() * up - 4,
      g: grav, t: 0, life: life * (0.6 + Math.random() * 0.7),
      c: cols[(Math.random() * cols.length) | 0],
      s: size || (Math.random() < 0.25 ? 2 : 1),
      d: drift || 0, ph: Math.random() * TAU
    });
  }
}
function guardScale(){ return Math.max(1, Math.min(3, Math.round(LOGH / 145))); }

/* ---------------- update ---------------- */
function update(dt){
  timeAll += dt;
  var i, t, gs = guardScale();

  /* Hitstop: hold the frame for a few ms on impact. The timers still run so
     the freeze always ends, but nothing else moves - the oldest trick for
     making a hit feel heavy. */
  if (freeze > 0){ freeze -= dt; if (freeze > 0) dt = 0; }
  if (flash > 0) flash = Math.max(0, flash - dt * 3.2);
  if (comboT > 0){ comboT -= dt; if (comboT <= 0) combo = 0; }
  for (var pi = pops.length - 1; pi >= 0; pi--){
    pops[pi].t += dt; if (pops[pi].t >= pops[pi].life) pops.splice(pi, 1);
  }
  for (var ri = rings.length - 1; ri >= 0; ri--){
    rings[ri].t += dt; if (rings[ri].t >= rings[ri].life) rings.splice(ri, 1);
  }
  if (shake > 0) shake = Math.max(0, shake - dt * 9);
  if (G.hop > 0) G.hop = Math.max(0, G.hop - dt * 3.6);

  /* salute: fires as he draws level with a tree that keeps its work */
  if (phase === 'run'){
    for (i = 0; i < trees.length; i++){
      t = trees[i];
      if (!t.doomed && !t.saluted && G.x > t.x - 20){
        t.saluted = true; keptCount++;
        saluteT = SALUTE_DUR; G.hop = 1;
        spawn(t.x, GROUND_Y + t.puffCY, 10, [t.pal.l, t.pal.m, '#FFF2C0'], 26, 12, 0.9, 22, 6);
      }
    }
  }
  if (saluteT > 0) saluteT = Math.max(0, saluteT - dt);

  if (phase === 'run'){
    var j = nextDoomed();
    var tgt = j >= 0 ? trees[j].x - 23 * gs : FINALE_X;
    var step = RUN_SPEED * dt;
    if (G.x + step >= tgt){
      G.x = tgt; G.legDist += step;
      if (j >= 0){ phase = 'chop'; curTree = j; swing = 0; swingT = 0; struck = false; lastHit = -1; G.spin = 0; }
      else { phase = 'finale'; finT = 0; finX0 = G.x; }   /* work done - he shows off */
    } else { G.x += step; G.legDist += step; }
    G.axe = angLerp(G.axe, saluteT > 0 ? AXE_SALUTE : AXE_REST, Math.min(1, dt * 10));
    /* run-cycle squash: he compresses as each foot lands */
    var bounce = Math.sin(G.legDist / 5.6);
    G.sqy = 1 + bounce * 0.07;
    G.sqx = 1 - bounce * 0.06;
    G.lean = 1;

  } else if (phase === 'chop'){
    /* One continuous whirl instead of discrete chops. swingT runs the whole
       move; the axe angle is a free-running rotation, so the blade never
       "resets" mid-spin the way a per-swing lerp would. */
    t = trees[curTree];
    swingT += dt;
    var spinTotal = SPIN_REVS * SPIN_DUR;

    if (swingT < SPIN_WIND){                        /* coil */
      var p0 = smooth(swingT / SPIN_WIND);
      G.axe  = AXE_REST + (AXE_WIND - AXE_REST) * p0;
      G.lean = -2.4 * p0;
      G.spin = 0;
      G.sqy = 1 - 0.10 * p0; G.sqx = 1 + 0.09 * p0;  /* crouch */

    } else if (swingT < SPIN_WIND + spinTotal){     /* the whirl */
      var st = swingT - SPIN_WIND;
      var rev = st / SPIN_DUR;                       /* revolutions elapsed */
      /* ease in over the first half-rev and out over the last, so it winds up
         and winds down rather than snapping to full speed. */
      var ramp = clamp(rev / 0.5, 0, 1) * clamp((SPIN_REVS - rev) / 0.6, 0, 1);
      G.axe  = AXE_WIND + rev * TAU;                 /* free-running, never wrapped */
      G.spin = rev * TAU;                            /* body counter-rotates with it */
      G.lean = 0;
      /* Turning about the vertical axis: he presents his full width facing the
         camera and narrows to a sliver edge-on. |cos| is that foreshortening,
         eased in by ramp so the first frame does not pop. */
      var face = Math.abs(Math.cos(G.spin));
      G.sqx = 1 - ramp * (1 - (0.46 + 0.54 * face));
      G.sqy = 1 + 0.05 * ramp * (1 - face);          /* a touch taller when thin */

      /* The blade bites once per revolution, at the bottom of its arc. */
      if (Math.random() < 0.55)                     /* grit kicked up by the whirl */
        spawn(G.x + (Math.random() * 10 - 5), GROUND_Y - 1, 1,
              ['#C9A97A', '#8A6A44'], 26, 12, 0.35, 150);

      var hit = Math.floor(rev);
      if (hit > lastHit && hit < SPIN_REVS){
        lastHit = hit;
        t.shake = 0.20 + 0.05 * hit;
        kick(1.6 + 0.6 * hit, 1, 0.4);
        ring(t.x, GROUND_Y - 6, '#FFF6D8');
        spawn(t.x - 3, GROUND_Y - 5, 9 + 3 * hit, ['#E6D2AE', '#C9A97A', '#8A6A44'], 52, 30, 0.5, 170);
        spawn(t.x + t.puffCX, GROUND_Y + t.puffCY, 7, [t.pal.m, t.pal.l], 34, 10, 1.0, 24, 10);
      }

    } else if (swingT < SPIN_WIND + spinTotal + SPIN_OUT){   /* settle */
      var q = (swingT - SPIN_WIND - spinTotal) / SPIN_OUT;
      G.axe  = AXE_WIND + SPIN_REVS * TAU + SWEEP * smooth(q) * 0.35;
      G.spin = SPIN_REVS * TAU * (1 - smooth(q));    /* unwind to face front */
      G.lean = 2 * (1 - q);
      G.sqy = 1 - 0.10 * (1 - q); G.sqx = 1 + 0.09 * (1 - q);
      if (!struck){                                  /* the felling blow */
        struck = true;
        t.shake = 0.34;
        combo++; comboT = 2.6;
        if (combo > best) best = combo;
        var gain = 100 * combo;
        score += gain;
        kick(3.4 + combo * 0.35, 1, 1);
        ring(t.x, GROUND_Y - 8, '#FFD36B');
        ring(t.x, GROUND_Y - 8, '#FF8FA8');
        pop(t.x, GROUND_Y - 34, '+' + gain, '#FFD36B', true);
        spawn(t.x - 3, GROUND_Y - 5, 18, ['#E6D2AE', '#C9A97A', '#8A6A44'], 60, 34, 0.6, 165);
        spawn(t.x + t.puffCX, GROUND_Y + t.puffCY, 14, [t.pal.m, t.pal.l], 40, 14, 1.2, 26, 12);
        t.state = 'falling'; t.fallT = 0; phase = 'fall';
      }
    }

  } else if (phase === 'fall'){
    t = trees[curTree];
    t.fallT += dt;
    var f = t.fallT / FALL_DUR;
    G.axe = angLerp(G.axe, AXE_REST, Math.min(1, dt * 6));
    G.sqy = 1; G.sqx = 1; G.lean = 0;
    if (!t.leafDrop && f > 0.26){
      t.leafDrop = true;
      spawn(t.x + t.puffCX * 0.5, GROUND_Y + t.puffCY, 14,
            [t.pal.m, t.pal.l, t.pal.d], 26, 4, 1.6, 20, 12);
    }
    if (!t.boom && f > 0.78){
      t.boom = true; t.puffGone = true; shake = 3.2;
      var lx = t.x + (t.H - t.R) * 0.94;            /* where the crown comes down */
      var ly = GROUND_Y - t.R * 0.6;
      spawn(lx, ly, 40, [t.pal.m, t.pal.l, t.pal.d], 78, 22, 1.9, 16, 20);
      spawn(lx, GROUND_Y - 2, 18, ['#D8C39A', '#B39A6E', '#EFE4C8'], 70, 14, 0.9, 120);
      spawn(t.x, GROUND_Y - 4, 10, ['#E6D2AE', '#C9A97A'], 40, 20, 0.7, 150);
    }
    if (f >= 1){ t.state = 'down'; cutCount++; phase = 'run'; }

  } else if (phase === 'finale'){
    /* The ceremony, in the only order that works: plant the axe FIRST, then
       flip up onto its handle, balance, bow. You cannot land on an axe that
       has not been thrown yet - that was the flaw before. One timeline in
       finT, so the beats cannot drift apart. */
    finT += dt;
    G.face = 1;
    var hTop = -AXE_HANDLE_H;                  /* pommel height above ground */

    if (finT < FIN_THROW){                                   /* 1. plant it */
      var v = finT / FIN_THROW;
      G.hopY = 0; G.rot = 0; G.balance = 0;
      G.axe  = angLerp(AXE_WIND, AXE_STRIKE, smooth(v));
      G.lean = -2 + 4 * v;
      if (!axeStuck && v > 0.72){
        axeStuck = true;
        axeX = G.x + 15 * guardScale();
        kick(2.4, 1, 1); ring(axeX, GROUND_Y - 3, '#FFD36B');
        spawn(axeX, GROUND_Y - 1, 14, ['#C9A97A', '#8A6A44', '#E6D2AE'], 48, 20, 0.5, 150);
      }

    } else if (finT < FIN_THROW + FIN_FLIP){                 /* 2. flip ONTO it */
      var u = (finT - FIN_THROW) / FIN_FLIP;
      var e = smooth(u);
      G.x    = finX0 + (axeX - finX0) * e;                   /* travels to the axe */
      G.hopY = hTop * e - Math.sin(u * Math.PI) * 16;        /* arcs over, settles on it */
      G.rot  = -(e * TAU) - Math.PI * e;                     /* 1.5 turns, ends inverted */
      G.balance = e;
      G.lean = 0; G.sqx = 1; G.sqy = 1;
      if (!finLand && u > 0.93){
        finLand = true;
        kick(1.5, 0.4, 1); ring(axeX, GROUND_Y - 4, '#FFF6D8');
        pop(axeX, GROUND_Y + hTop - 24, 'LORAX DONE', '#FFD36B', true, true);
      }

    } else if (finT < FIN_THROW + FIN_FLIP + FIN_BAL){       /* 3. hold it */
      var b2 = (finT - FIN_THROW - FIN_FLIP) / FIN_BAL;
      G.x = axeX; G.balance = 1; G.hopY = hTop;
      /* the constant micro-correction of a real handstand */
      G.rot  = Math.PI + Math.sin(finT * 6.5) * 0.055 + Math.sin(finT * 11.3) * 0.02;
      G.lean = 0; G.sqx = 1; G.sqy = 1;

    } else if (finT < FIN_THROW + FIN_FLIP + FIN_BAL + FIN_BOW){   /* 4. bow */
      var w = (finT - FIN_THROW - FIN_FLIP - FIN_BAL) / FIN_BOW;
      G.x = axeX; G.balance = 1; G.hopY = hTop;              /* bows FROM the balance */
      var dip = Math.sin(clamp(w / 0.7, 0, 1) * Math.PI);
      G.rot  = Math.PI + 0.55 * dip;
      G.sqy  = 1 - 0.12 * dip;
      G.sqx  = 1 + 0.08 * dip;

    } else if (summaryT < 0){
      summaryT = 0;
      phase = 'done';
    }

  } else if (phase === 'done'){
    summaryT += dt;
    if (axeStuck){                       /* stays up there, still wobbling */
      G.x = axeX; G.balance = 1; G.hopY = -AXE_HANDLE_H;
      G.rot = Math.PI + Math.sin(timeAll * 5.5) * 0.05;
    } else {
      G.axe = angLerp(G.axe, AXE_SALUTE, Math.min(1, dt * 5));
      G.rot = 0; G.hopY = 0;
    }
    G.sqy = 1; G.sqx = 1; G.lean = 0;
  }

  for (i = 0; i < trees.length; i++) if (trees[i].shake > 0) trees[i].shake -= dt;

  for (i = parts.length - 1; i >= 0; i--){
    var p2 = parts[i];
    p2.t += dt;
    p2.x += (p2.vx + (p2.d ? Math.sin(timeAll * 2.4 + p2.ph) * p2.d : 0)) * dt;
    p2.y += p2.vy * dt;
    p2.vy += p2.g * dt;
    if (p2.d){ p2.vx *= (1 - Math.min(0.9, dt * 1.2)); if (p2.vy > 22) p2.vy = 22; }
    if (p2.y > GROUND_Y - 1){ p2.y = GROUND_Y - 1; p2.vy *= -0.26; p2.vx *= 0.6; }
    if (p2.t > p2.life) parts.splice(i, 1);
  }
}

function drawSky(){
  var bands = [
    [0.00, '#4E93E8'], [0.16, '#5FA6F2'], [0.34, '#79BCFA'],
    [0.54, '#96CFFD'], [0.74, '#B4E1FE'], [0.90, '#D2EEFF']
  ];
  var i, x;
  for (i = 0; i < bands.length; i++){
    var y0 = Math.round(bands[i][0] * GROUND_Y);
    var y1 = i + 1 < bands.length ? Math.round(bands[i + 1][0] * GROUND_Y) : GROUND_Y;
    sc.fillStyle = bands[i][1];
    sc.fillRect(0, y0, LOGW, y1 - y0);
  }
  /* dithered seams, so the gradient reads as pixel art and not a blur */
  for (i = 1; i < bands.length; i++){
    var y = Math.round(bands[i][0] * GROUND_Y);
    sc.fillStyle = bands[i][1];
    for (x = (i % 2); x < LOGW; x += 2) sc.fillRect(x, y - 1, 1, 1);
    sc.fillStyle = bands[i - 1][1];
    for (x = ((i + 1) % 2); x < LOGW; x += 2) sc.fillRect(x, y, 1, 1);
  }
  /* sun with a soft corona */
  var sx = Math.round(LOGW * 0.82), sy = Math.round(GROUND_Y * 0.17);
  sc.globalAlpha = 0.28; pxCircle(sc, sx, sy, 15, '#FFF6C8');
  sc.globalAlpha = 0.42; pxCircle(sc, sx, sy, 12, '#FFF0AC');
  sc.globalAlpha = 1;
  pxCircle(sc, sx, sy, 9, '#FFF3B0');
  pxCircle(sc, sx, sy, 7, '#FFE066');
}
function drawCloud(x, y, s){
  var w = Math.round(9 * s), h = Math.max(2, Math.round(4 * s));
  sc.fillStyle = '#EDF7FF';
  sc.fillRect(x - w, y, w * 2, h);
  pxCircle(sc, x - w + 2, y + 1, Math.round(3.5 * s), '#EDF7FF');
  pxCircle(sc, x,         y - 1, Math.round(5.5 * s), '#EDF7FF');
  pxCircle(sc, x + w - 3, y,     Math.round(4 * s),   '#EDF7FF');
  sc.fillStyle = '#C6DFF3';
  sc.fillRect(x - w, y + h - 1, w * 2, 1);
}
function drawMountains(cam){
  var off = cam * 0.14;
  for (var x = 0; x < LOGW; x++){
    var wx = x + off;
    var h = GROUND_Y * (0.22 + 0.055 * Math.sin(wx / 120) + 0.035 * Math.sin(wx / 47.5 + 1.7));
    var top = Math.round(GROUND_Y - h);
    sc.fillStyle = '#8FA9CE'; sc.fillRect(x, top, 1, GROUND_Y - top);
    sc.fillStyle = '#B9CBE6'; sc.fillRect(x, top, 1, 1);
  }
}
function drawFarGrove(cam){
  var off = cam * 0.30;
  for (var i = 0; i < FARTREES.length; i++){
    var f = FARTREES[i];
    var x = Math.round(f.x - off);
    if (x < -30 || x > LOGW + 30) continue;
    var h = Math.round(GROUND_Y * f.h * 0.55);
    var R = Math.max(3, Math.round(f.R * (GROUND_Y / 110)));
    var baseY = Math.round(GROUND_Y - GROUND_Y * 0.10);
    var topY = baseY - h;
    sc.fillStyle = '#4E6E7E';
    for (var y = topY; y < baseY; y++){
      var xo = Math.round(Math.sin((y - topY) / Math.max(1, h) * 2.4 + f.k * 6) * 2);
      sc.fillRect(x + xo, y, 1, 1);
    }
    var pal = PUFFS[f.p];
    sc.globalAlpha = 0.55; pxCircle(sc, x, topY, R, pal.m);
    sc.globalAlpha = 0.30; pxCircle(sc, x - 1, topY - 1, Math.max(1, R - 2), pal.l);
    sc.globalAlpha = 1;
  }
}
function drawHills(cam){
  var off = cam * 0.44, x, wx, h, top;
  for (x = 0; x < LOGW; x++){
    wx = x + off;
    h = GROUND_Y * (0.19 + 0.055 * Math.sin(wx / 46) + 0.028 * Math.sin(wx / 17.3));
    top = Math.round(GROUND_Y - h);
    sc.fillStyle = '#6E9E78'; sc.fillRect(x, top, 1, GROUND_Y - top);
    sc.fillStyle = '#8CBB92'; sc.fillRect(x, top, 1, 2);
  }
  off = cam * 0.60;
  for (x = 0; x < LOGW; x++){
    wx = x + off;
    h = GROUND_Y * (0.11 + 0.035 * Math.sin(wx / 33 + 2) + 0.02 * Math.sin(wx / 13.7));
    top = Math.round(GROUND_Y - h);
    sc.fillStyle = '#4F8A5E'; sc.fillRect(x, top, 1, GROUND_Y - top);
    sc.fillStyle = '#61A070'; sc.fillRect(x, top, 1, 1);
  }
}
function drawBushes(cam){
  var off = cam * 0.78;
  for (var i = 0; i < BUSHES.length; i++){
    var b = BUSHES[i];
    var x = Math.round(b.x - off);
    if (x < -40 || x > LOGW + 40) continue;
    var base = GROUND_Y + 1;
    if (b.k < 0.30){                                    /* a truffula sapling */
      var h = Math.round(b.h * 1.5), R = Math.max(3, Math.round(b.w * 0.55));
      var pal = PUFFS[b.p];
      sc.fillStyle = '#2E241F';
      for (var y = 0; y < h; y++)
        sc.fillRect(x + Math.round(Math.sin(y / Math.max(1, h) * 2.2) * 2), base - y, 1, 1);
      pxCircle(sc, x, base - h - R + 2, R + 1, pal.d);
      pxCircle(sc, x, base - h - R + 2, R,     pal.m);
      pxCircle(sc, x - 1, base - h - R, Math.max(1, R - 2), pal.l);
    } else {
      pxCircle(sc, x, base - b.h + 2, Math.round(b.w * 0.85), '#2F7349');
      pxCircle(sc, x - 3, base - b.h - 1, Math.round(b.w * 0.55), '#3E8F5B');
      sc.fillStyle = '#2F7349'; sc.fillRect(x - b.w, base - 4, b.w * 2, 4);
    }
  }
}
function drawGround(cam){
  var dirtTop = GROUND_Y + 8;
  sc.fillStyle = '#4FAE45'; sc.fillRect(0, GROUND_Y, LOGW, 5);
  sc.fillStyle = '#69D25B'; sc.fillRect(0, GROUND_Y, LOGW, 2);
  sc.fillStyle = '#3B8636'; sc.fillRect(0, GROUND_Y + 5, LOGW, 3);
  sc.fillStyle = '#94663C'; sc.fillRect(0, dirtTop, LOGW, LOGH - dirtTop + 8);
  sc.fillStyle = '#3B8636';
  for (var x = ((-cam) % 2 + 2) % 2; x < LOGW; x += 2) sc.fillRect(x, dirtTop, 1, 1);
  var c0 = Math.floor(cam), depth = Math.max(2, LOGH + 6 - dirtTop);
  for (x = 0; x < LOGW; x++){
    var wx = x + c0;
    var n = ((wx * 2654435761) >>> 0);
    if ((n & 31) === 0){ sc.fillStyle = '#734C2C'; sc.fillRect(x, dirtTop + 2 + (n >>> 5) % depth, 2, 1); }
    if ((n & 63) === 7){ sc.fillStyle = '#B08256'; sc.fillRect(x, dirtTop + 3 + (n >>> 7) % depth, 1, 1); }
  }
}
function drawTufts(cam){
  var off = cam * 1.16;
  for (var i = 0; i < TUFTS.length; i++){
    var g = TUFTS[i];
    var x = Math.round(g.x - off);
    if (x < -6 || x > LOGW + 6) continue;
    var h = g.h, sway = Math.round(Math.sin(timeAll * 1.3 + g.k * 9));
    sc.fillStyle = g.k < 0.5 ? '#2C7431' : '#37913D';
    sc.fillRect(x + sway, GROUND_Y + 3 - h, 1, h);
    sc.fillRect(x + 2, GROUND_Y + 4 - h, 1, h);
    sc.fillRect(x + 1, GROUND_Y + 2, 1, 2);
  }
}
function drawFlowers(cam){
  var off = cam * 1.16;
  for (var i = 0; i < FLOWERS.length; i++){
    var f = FLOWERS[i];
    var x = Math.round(f.x - off);
    if (x < -6 || x > LOGW + 6) continue;
    var sway = Math.round(Math.sin(timeAll * 1.7 + f.k * 11));
    var ty = GROUND_Y + 3 - f.h;
    sc.fillStyle = '#2C7431';
    sc.fillRect(x, ty, 1, f.h);
    sc.fillStyle = f.c;
    sc.fillRect(x + sway, ty - 2, 1, 1);
    sc.fillRect(x - 1 + sway, ty - 1, 3, 1);
    sc.fillRect(x + sway, ty, 1, 1);
    sc.fillStyle = '#FFF6C8'; sc.fillRect(x + sway, ty - 1, 1, 1);
  }
}

function fallAngle(u){
  var MAX = 1.53;
  if (u <= 0.84) return MAX * Math.pow(u / 0.84, 1.9);
  var b = (u - 0.84) / 0.16;
  return MAX * (1 - 0.075 * Math.sin(b * Math.PI * 3) * (1 - b));
}

function drawTreeBody(t, cam){
  var sx = Math.round(t.x - cam);
  if (sx < -t.sprH - 140 || sx > LOGW + t.sprW + 140) return;
  var py = GROUND_Y - 2;

  if (!t.doomed && t.state === 'up'){
    var pulse = 0.5 + 0.5 * Math.sin(timeAll * 2.0 + t.idx);
    sc.globalAlpha = 0.10 + pulse * 0.07;
    pxCircle(sc, sx + t.puffCX, py + t.puffCY, t.R + 7, '#CFFFE2');
    sc.globalAlpha = 0.09 + pulse * 0.05;
    pxCircle(sc, sx + t.puffCX, py + t.puffCY, t.R + 4, '#F0FFF6');
    sc.globalAlpha = 1;
  }

  var ang = 0;
  if (t.state === 'falling') ang = fallAngle(clamp(t.fallT / FALL_DUR, 0, 1));
  else if (t.state === 'down') ang = fallAngle(1);

  var shakeX = t.shake > 0 ? ((Math.sin(t.shake * 90) * 1.6) | 0) : 0;
  var img = t.puffGone ? t.bare : t.spr;
  /* standing trunks sway slowly in the wind */
  var sway = (t.state === 'up') ? Math.sin(timeAll * 0.9 + t.idx * 1.7) * 0.016 : 0;

  if (ang === 0 && sway === 0){
    sc.drawImage(img, sx - t.pivotX + shakeX, py - t.pivotY);
  } else {
    sc.save();
    sc.translate(sx + shakeX, py);
    sc.rotate(ang + sway);
    sc.drawImage(img, -t.pivotX, -t.pivotY);
    sc.restore();
  }

  if (ang !== 0){
    /* the splintered stump left in the dirt */
    sc.fillStyle = BARK_EDGE;  sc.fillRect(sx - 4, GROUND_Y - 4, 9, 4);
    sc.fillStyle = t.stripe.b; sc.fillRect(sx - 3, GROUND_Y - 4, 7, 4);
    sc.fillStyle = '#E6D2AE';  sc.fillRect(sx - 3, GROUND_Y - 4, 7, 1);
    sc.fillStyle = '#C9A97A';  sc.fillRect(sx - 2, GROUND_Y - 5, 1, 1);
    sc.fillRect(sx + 1, GROUND_Y - 5, 2, 1);
  }

  if (!t.doomed && t.saluted && t.state === 'up'){
    for (var k = 0; k < 3; k++){
      var ph = timeAll * 1.6 + k * 2.1 + t.idx;
      if ((Math.sin(ph) + 1) / 2 > 0.55){
        sc.fillStyle = k % 2 ? '#FFF3C4' : '#B6FFCF';
        var sxx = sx + t.puffCX + Math.round(Math.cos(ph * 1.7 + k) * (t.R + 5));
        var syy = py + t.puffCY + Math.round(Math.sin(ph * 1.3 + k) * (t.R + 3));
        sc.fillRect(sxx, syy, 1, 1);
        sc.fillRect(sxx - 1, syy, 1, 1); sc.fillRect(sxx + 1, syy, 1, 1);
        sc.fillRect(sxx, syy - 1, 1, 1); sc.fillRect(sxx, syy + 1, 1, 1);
      }
    }
  }
}

/* the name sign. Standing: axis aligned and pixel-exact, hung off the trunk.
   Felled: it tumbles free and settles upright in the grass, still readable. */
function drawTreePlaque(t, cam){
  var sx = Math.round(t.x - cam);
  if (sx < -t.plqW - 160 || sx > LOGW + t.plqW + 160) return;
  var pw = t.plqW, ph = t.plqH;
  var topY = clamp(GROUND_Y + t.signDY, 13, Math.max(13, GROUND_Y - ph - 6));

  if (t.state === 'up'){
    var pxx = sx - (pw >> 1);
    sc.fillStyle = t.sign.post;
    sc.fillRect(sx - 6, topY - 3, 2, 3);
    sc.fillRect(sx + 5, topY - 3, 2, 3);
    sc.fillStyle = 'rgba(0,0,0,0.26)'; sc.fillRect(pxx + 2, topY + 2, pw, ph);
    sc.drawImage(t.plq, pxx, topY);
    return;
  }

  var u  = t.state === 'down' ? 1 : clamp(t.fallT / FALL_DUR, 0, 1);
  var pu = clamp((u - 0.05) / 0.95, 0, 1);
  var restX = sx + Math.min(70, Math.round(t.H * 0.42));
  var restY = GROUND_Y - ph - 1;
  var cx = sx + (restX - sx) * pu;
  var yy = topY + (restY - topY) * Math.pow(pu, 1.7);
  var rot = 0.95 * Math.sin(pu * Math.PI) * (1 - pu * 0.35);

  sc.globalAlpha = 1 - 0.30 * pu;
  if (pu >= 1 || Math.abs(rot) < 0.004){
    sc.drawImage(t.plq, Math.round(cx) - (pw >> 1), Math.round(yy));
  } else {
    sc.save();
    sc.translate(Math.round(cx), Math.round(yy + ph / 2));
    sc.rotate(rot);
    sc.drawImage(t.plq, -(pw >> 1), -(ph >> 1));
    sc.restore();
  }
  sc.globalAlpha = 1;
}

function drawGuardian(cam){
  var gs = guardScale();
  var running = (phase === 'run');

  /* build this frame's body into the buffer, then squash it on the way out */
  gb.clearRect(0, 0, GW, GH);
  var stride = G.legDist / 5.6;
  if (running){
    var a = stride;
    drawLeg(gb, 10, Math.sin(a) * 3.4,            Math.max(0, Math.cos(a)));
    drawLeg(gb, 15, Math.sin(a + Math.PI) * 3.4,  Math.max(0, Math.cos(a + Math.PI)));
    drawRows(gb, BODY, 0, 0);
    drawFreeArm(gb, Math.sin(a + Math.PI));
  } else {
    var idle = Math.sin(timeAll * 2.2) * 0.6;
    drawLeg(gb, 10, -1 + idle * 0.3, 0);
    drawLeg(gb, 15,  1 - idle * 0.3, 0);
    drawRows(gb, BODY, 0, 0);
    if (phase !== 'chop') drawFreeArm(gb, idle * 0.5);
  }

  var hop = G.hop > 0 ? Math.round(Math.sin(G.hop * Math.PI) * 3) : 0;
  var bob = running ? (Math.sin(stride * 2) > 0 ? -1 : 0) : 0;
  var footY = GROUND_Y + 1 - hop - bob + Math.round(G.hopY);
  /* balancing: his weight is on the pommel, so ride the handle, not the ground */
  if (G.balance > 0) footY -= Math.round(2 * guardScale() * G.balance);
  var dw = Math.max(1, Math.round(GW * gs * G.sqx));
  var dh = Math.max(1, Math.round(GH * gs * G.sqy));
  var dx = Math.round(G.x - cam) - Math.round(dw / 2) + Math.round(G.lean);
  var dy = footY - dh;

  if (G.fade <= 0.01) return;                 /* inside the house */
  var gAlpha = G.fade;
  sc.globalAlpha = (0.22 - (hop ? 0.07 : 0)) * gAlpha;
  sc.fillStyle = '#12300F';
  var shw = Math.round(dw * 0.72);
  sc.fillRect(dx + Math.round((dw - shw) / 2), GROUND_Y, shw, 1);
  sc.fillRect(dx + Math.round((dw - shw) / 2) + 2, GROUND_Y + 1, Math.max(1, shw - 4), 1);
  sc.globalAlpha = 1;

  var shoulderX = dx + Math.round(19 * gs * G.sqx);
  var shoulderY = dy + Math.round(15 * gs * G.sqy);

  /* Valkyrie whirl. He spins about his VERTICAL axis (the xz plane), not like a
     cartwheel: the axe sweeps a flat circle around him, which projects to a wide
     shallow ELLIPSE on screen. sin(spin) is depth - positive is toward the
     viewer, negative is behind him - and it drives draw order and scale, which
     is what sells the third axis in a 2D sprite. */
  var spinning = (phase === 'chop' && G.spin > 0);
  var spinDepth = 0, spinScale = 1;
  if (spinning){
    var cx = dx + Math.round(dw / 2), cy = dy + Math.round(dh * 0.44);
    var orbX = 11 * gs, orbY = 3.2 * gs;      /* flat ellipse = seen near edge-on */
    spinDepth = Math.sin(G.spin);
    spinScale = 1 + 0.28 * spinDepth;          /* nearer reads bigger */
    shoulderX = Math.round(cx + Math.cos(G.spin) * orbX);
    shoulderY = Math.round(cy - spinDepth * orbY);

    /* the blade's trail, sampled back along the same ellipse */
    for (var tr = 1; tr <= 9; tr++){
      var a = G.spin - tr * 0.26;
      var d = Math.sin(a);
      sc.globalAlpha = (0.36 - tr * 0.035) * (0.55 + 0.45 * (d + 1) / 2);
      sc.fillStyle = tr < 3 ? '#FFF6D8' : '#CFC8DC';
      var px = Math.round(cx + Math.cos(a) * orbX * 1.25);
      var py = Math.round(cy - d * orbY * 1.25);
      var w  = Math.max(1, Math.round(gs * (1 + 0.3 * d)));
      sc.fillRect(px, py, w, w);
    }
    sc.globalAlpha = 1;
  }

  var wrapped = ((G.axe % TAU) + TAU) % TAU;
  var behind = spinning ? (spinDepth < 0)
                        : (wrapped > Math.PI * 0.70 && wrapped < Math.PI * 1.32);
  if (behind && !axeStuck) drawRotPix(sc, AXE_PIX, shoulderX, shoulderY, G.axe, gs);

  sc.globalAlpha = gAlpha;
  if (G.rot !== 0 || G.face < 0){
    /* flip, balance and bow all rotate him about his own middle */
    sc.save();
    sc.translate(dx + dw / 2, dy + dh / 2);
    if (G.rot) sc.rotate(G.rot);
    if (G.face < 0) sc.scale(-1, 1);
    sc.drawImage(gbuf, 0, 0, GW, GH, -dw / 2, -dh / 2, dw, dh);
    sc.restore();
  } else {
    sc.drawImage(gbuf, 0, 0, GW, GH, dx, dy, dw, dh);
  }

  if (!axeStuck){
    drawRotPix(sc, ARM_PIX, shoulderX, shoulderY, G.axe, gs);
    if (!behind) drawRotPix(sc, AXE_PIX, shoulderX, shoulderY, G.axe, gs);
  }

  if (saluteT > 0 || phase === 'done'){
    if ((Math.sin(timeAll * 9) + 1) / 2 > 0.4){
      sc.fillStyle = '#FFF3C4';
      var hx = dx + Math.round(dw / 2), hy = dy - 4;
      sc.fillRect(hx, hy, 1, 1);
      sc.fillRect(hx - 2, hy, 1, 1); sc.fillRect(hx + 2, hy, 1, 1);
      sc.fillRect(hx, hy - 2, 1, 1); sc.fillRect(hx, hy + 2, 1, 1);
    }
  }
}

/* The axe once it is thrown: buried head-first, handle standing up, which is
   what he balances on. Drawn in world space so he can be above it. */
function drawPlantedAxe(cam){
  if (!axeStuck) return;
  var x = Math.round(axeX - cam);
  if (x < -20 || x > LOGW + 20) return;
  var gs = guardScale();
  var hL = AXE_HANDLE_H;                     /* must match what he balances on */
  var y0 = GROUND_Y - hL;

  sc.fillStyle = 'rgba(0,0,0,0.22)';         /* it casts a shadow */
  sc.fillRect(x - 4, GROUND_Y, 9, 1);

  /* the buried head */
  sc.fillStyle = '#C8CBD8'; sc.fillRect(x - 3, GROUND_Y - 4, 7, 4);
  sc.fillStyle = '#8E93A6'; sc.fillRect(x - 3, GROUND_Y - 1, 7, 1);
  /* the handle */
  sc.fillStyle = '#A2733D'; sc.fillRect(x, y0, Math.max(1, gs), hL);
  sc.fillStyle = '#5B3D1F'; sc.fillRect(x + Math.max(1, gs), y0, 1, hL);
  /* a glint on the pommel */
  sc.fillStyle = '#FFF6D8'; sc.fillRect(x, y0, Math.max(1, gs), 1);
}
function drawParticles(cam){
  for (var i = 0; i < parts.length; i++){
    var p = parts[i];
    var a = 1 - p.t / p.life;
    if (a < 0.4 && ((i + Math.floor(timeAll * 20)) % 2)) continue;
    sc.fillStyle = p.c;
    sc.fillRect(Math.round(p.x - cam), Math.round(p.y), p.s, p.s);
  }
}

function drawRings(cam){
  for (var i = 0; i < rings.length; i++){
    var r = rings[i], u = r.t / r.life;
    var rad = 3 + u * 26, x = Math.round(r.x - cam), y = r.y;
    sc.globalAlpha = (1 - u) * 0.75;
    sc.fillStyle = r.col;
    /* a flat ellipse, so it lies on the ground rather than facing the camera */
    for (var a = 0; a < TAU; a += 0.20){
      sc.fillRect(Math.round(x + Math.cos(a) * rad),
                  Math.round(y + Math.sin(a) * rad * 0.34), 1, 1);
    }
  }
  sc.globalAlpha = 1;
}
function drawPops(cam){
  for (var i = 0; i < pops.length; i++){
    var p = pops[i], u = p.t / p.life;
    var rise = Math.pow(u, 0.6) * (p.big ? 26 : 16);
    var sc2 = p.big ? (u < 0.14 ? 1 + (0.14 - u) * 7 : 1) : 1;   /* a punchy pop-in */
    var col = p.col;
    sc.globalAlpha = u > 0.7 ? (1 - u) / 0.3 : 1;
    var w = textW(p.text, p.big ? 2 : 1) * sc2;
    /* fixed pops ignore the world and the camera - they sit dead center on
       screen, so a resize or a scroll can never carry them off the panel. */
    var x = Math.round(p.fixed ? (LOGW - w) / 2 : p.x - cam - w / 2);
    var y = Math.round(p.fixed ? LOGH / 2 - rise : p.y - rise);
    drawTextShadow(sc, p.text, x, y, col, 'rgba(0,0,0,0.65)', p.big ? 2 : 1);
  }
  sc.globalAlpha = 1;
}
function drawFlash(){
  if (flash <= 0.01) return;
  sc.globalAlpha = flash;
  sc.fillStyle = '#FFF6D8';
  sc.fillRect(0, 0, LOGW, LOGH);
  sc.globalAlpha = 1;
}
function drawHud(){
  sc.fillStyle = 'rgba(10,14,26,0.74)';
  sc.fillRect(0, 0, LOGW, 11);
  sc.fillStyle = '#2B3A5C'; sc.fillRect(0, 11, LOGW, 1);
  /* the repo whose worktrees these are - lorax runs per repo, so a bare
     "THE GROVE" told you nothing about which one you were looking at. */
  var left = (typeof REPO === 'string' && REPO) ? REPO.toUpperCase() : 'THE GROVE';
  var right = score > 0 ? String(score) : (cutCount + '/' + N_DOOMED);
  var rx = LOGW - 4 - textW(right);
  var lx = 4;
  if (rx >= lx + textW(left) + 6) drawText(sc, left, lx, 2, '#F2C14E', 1);
  if (rx >= 2) drawText(sc, right, rx, 2, score > 0 ? '#FFD36B' : '#CFE3FF', 1);
  if (combo > 1 && comboT > 0){
    var ct = combo + 'X';
    var cw = textW(ct, 1);
    var alpha = clamp(comboT / 0.6, 0, 1);
    sc.globalAlpha = alpha;
    drawText(sc, ct, Math.round(rx - cw - 5), 2, '#FF8FA8', 1);
    sc.globalAlpha = 1;
  }
}

function drawSummary(){
  var u = clamp(summaryT / 0.55, 0, 1);
  var ease = smooth(u);
  sc.fillStyle = 'rgba(6,10,22,' + (0.66 * ease) + ')';
  sc.fillRect(0, 0, LOGW, LOGH);

  var lines = [
    { s: 'PRUNED ' + cutCount, col: '#FF9E6B', z: 2 },
    { s: cutCount === 1 ? 'WORKTREE REMOVED' : 'WORKTREES REMOVED', col: '#B9A48C', z: 1 },
    { s: keptCount + ' LEFT STANDING', col: '#7BE39A', z: 2 },
    { s: keptCount === 0 ? 'THE FIELD IS CLEAR' : 'THEIR WORK LIVES NOWHERE ELSE', col: '#8FA98C', z: 1 }
  ];
  var boxW = Math.min(LOGW - 12, 214);
  var boxH = Math.min(LOGH - 14, 90);
  var bx = (LOGW - boxW) >> 1, by = ((LOGH - boxH) >> 1);
  var h = Math.max(2, Math.round(boxH * ease));
  var yTop = by + ((boxH - h) >> 1);

  sc.fillStyle = 'rgba(0,0,0,0.50)'; sc.fillRect(bx + 3, yTop + 3, boxW, h);
  sc.fillStyle = '#F2C14E';          sc.fillRect(bx, yTop, boxW, h);
  sc.fillStyle = '#8A6323';          sc.fillRect(bx + 1, yTop + 1, boxW - 2, h - 2);
  sc.fillStyle = '#101B2E';          sc.fillRect(bx + 2, yTop + 2, boxW - 4, h - 4);
  sc.fillStyle = '#1B2C48';          sc.fillRect(bx + 3, yTop + 3, boxW - 6, h - 6);
  sc.fillStyle = '#F2C14E';
  sc.fillRect(bx, yTop, 1, 1); sc.fillRect(bx + boxW - 1, yTop, 1, 1);
  sc.fillRect(bx, yTop + h - 1, 1, 1); sc.fillRect(bx + boxW - 1, yTop + h - 1, 1, 1);

  if (u < 0.9) return;
  sc.globalAlpha = clamp((summaryT - 0.5) / 0.45, 0, 1);

  /* a puff in each top corner, so the card belongs to this forest */
  var pf = PUFFS[2], pg = PUFFS[0];
  pxCircle(sc, bx + 14, by + 12, 6, pf.d); pxCircle(sc, bx + 14, by + 12, 5, pf.m);
  pxCircle(sc, bx + 12, by + 10, 2, pf.l);
  pxCircle(sc, bx + boxW - 14, by + 12, 6, pg.d); pxCircle(sc, bx + boxW - 14, by + 12, 5, pg.m);
  pxCircle(sc, bx + boxW - 16, by + 10, 2, pg.l);

  var ttl = 'THE GUARDIAN SPEAKS';
  drawText(sc, ttl, (LOGW - textW(ttl)) >> 1, by + 9, '#F2C14E', 1);
  sc.fillStyle = '#3C5375'; sc.fillRect(bx + 26, by + 19, boxW - 52, 1);
  var y = by + 26;
  for (var i = 0; i < lines.length; i++){
    var L = lines[i], z = L.z, w = textW(L.s, z);
    if (w > boxW - 12){ z = 1; w = textW(L.s, 1); }
    drawTextShadow(sc, L.s, (LOGW - w) >> 1, y, L.col, '#0A1120', z);
    y += (z === 2 ? 18 : 11);
  }
  sc.globalAlpha = 1;
}

function render(){
    /* on the stair he doubles back, so centre him rather than leading him */
  var lead = (phase === 'climb') ? 0.5 : 0.34;
  var cam = clamp(G.x - LOGW * lead, -20, Math.max(-20, FINALE_X + 60 - LOGW));
  var shx = 0, shy = 0;
  if (shake > 0.05){
    shx = Math.round(Math.sin(timeAll * 74) * shake * (0.5 + shakeDX));
    shy = Math.round(Math.cos(timeAll * 61) * shake * 0.6 * (0.5 + shakeDY));
  }

  drawSky();
  var i;
  for (i = 0; i < CLOUDS.length; i++){
    var cl = CLOUDS[i];
    var cx = cl.x - cam * 0.20 - timeAll * 3.2;
    cx = ((cx % SPAN) + SPAN) % SPAN;
    if (cx > -34 && cx < LOGW + 34) drawCloud(Math.round(cx), Math.round(cl.y * GROUND_Y), cl.s);
  }

  sc.save();
  sc.translate(shx, shy);

  drawMountains(cam);
  drawFarGrove(cam);
  drawHills(cam);
  drawBushes(cam);
  drawGround(cam);

  for (i = 0; i < trees.length; i++) if (trees[i].state === 'down') drawTreeBody(trees[i], cam);
  for (i = 0; i < trees.length; i++) if (trees[i].state !== 'down') drawTreeBody(trees[i], cam);
  for (i = 0; i < trees.length; i++) if (trees[i].state === 'down') drawTreePlaque(trees[i], cam);
  for (i = 0; i < trees.length; i++) if (trees[i].state !== 'down') drawTreePlaque(trees[i], cam);

  drawRings(cam);            /* shockwave lies on the ground, under everything */
  drawPlantedAxe(cam);       /* he balances on top of this, so it draws first */
  drawParticles(cam);
  drawGuardian(cam);
  drawTufts(cam);
  drawFlowers(cam);
  drawPops(cam);             /* score pops read above the scene */

  sc.restore();

  drawFlash();               /* outside the shake transform, so it covers all */
  drawHud();
  if (summaryT >= 0) drawSummary();
}

/* ---------------- display: fill the window, integer pixels, no letterbox --- */
var view = document.getElementById('c');
var vc = view.getContext('2d');
var crt = document.getElementById('crt');

var dirty = true;
function fit(){
  dirty = true;
  var w = Math.max(64, window.innerWidth || 480);
  var h = Math.max(48, window.innerHeight || 270);

  /* an integer pixel size that keeps the logical canvas in a readable band */
  var s = clamp(Math.round(h / 150), 1, 8);
  while (s > 1 && (w / s) < 190) s--;
  while (s < 8 && (h / s) > 260) s++;

  PXS  = s;
  LOGW = Math.ceil(w / s);
  LOGH = Math.ceil(h / s);
  GROUND_Y = LOGH - clamp(Math.round(LOGH * 0.20), 12, 36);

  scene.width = LOGW; scene.height = LOGH;
  sc = scene.getContext('2d');
  sc.imageSmoothingEnabled = false;

  view.width  = LOGW * s;
  view.height = LOGH * s;
  view.style.width  = (LOGW * s) + 'px';
  view.style.height = (LOGH * s) + 'px';
  vc.imageSmoothingEnabled = false;
  crt.style.opacity = s >= 3 ? '0.9' : '0.45';

  if (builtFor !== GROUND_Y) buildAll();
}
window.addEventListener('resize', fit);
fit();

function signalDone(){
  if (doneSent) return;
  doneSent = true;
  try {
    if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.lorax){
      window.webkit.messageHandlers.lorax.postMessage("done");
    }
  } catch (e) { /* a plain browser has no native host, and that is fine */ }
  try { document.getElementById('bar').classList.add('on'); } catch (e) {}
}

/* A thrown exception used to kill the render loop and leave a blank panel with
   no clue why. Surface it instead - a broken cartoon must still say it broke. */
window.addEventListener('error', function(ev){
  try {
    var d = document.createElement('div');
    d.style.cssText = 'position:fixed;left:0;right:0;bottom:0;z-index:9;padding:3px 5px;' +
      'background:#7a1020;color:#ffd9df;font:9px ui-monospace,Menlo,monospace';
    d.textContent = 'anim error: ' + (ev.message || 'unknown');
    document.body.appendChild(d);
  } catch (e) {}
});

var last = 0;
function frame(ts){
  if (!last) last = ts;
  var dt = Math.min(0.05, (ts - last) / 1000);
  last = ts;

  var settled = (phase === 'done' && summaryT > 2.4 && parts.length === 0);
  if (!settled) update(dt);
  if (phase === 'done' && summaryT > 2.2) signalDone();

  if (!settled || dirty){
    render();
    vc.imageSmoothingEnabled = false;
    vc.drawImage(scene, 0, 0, view.width, view.height);
    dirty = false;
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

})();
</script>
<script>
/* The technical readout. The cartoon says WHAT was cut; this says WHY, in the
   same words the terminal report uses. Reasons come from lorax.sh, so the two
   surfaces cannot drift. */
(function(){
'use strict';
function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"]/g, function(ch){
    return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[ch];
  });
}
function group(title, list, cls){
  if (!list.length) return '';
  var h = '<h2>' + esc(title) + ' (' + list.length + ')</h2>';
  for (var i = 0; i < list.length; i++){
    h += '<div class="row ' + cls + '"><span class="nm">' + esc(list[i].name) + '</span>' +
         '<span class="rs">' + esc(list[i].reason || '-') + '</span></div>';
  }
  return h;
}
function close(){
  try {
    if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.lorax){
      window.webkit.messageHandlers.lorax.postMessage("close");
    }
  } catch (e) {}
  try { window.close(); } catch (e) {}
}
var trees = (typeof TREES !== 'undefined' && TREES) ? TREES : [];
var cut  = trees.filter(function(t){ return t.doomed; });
var kept = trees.filter(function(t){ return !t.doomed; });

document.getElementById('panel').innerHTML =
  group('cut - work is recoverable', cut, 'cut') +
  group('left standing', kept, 'kept');

document.getElementById('x').addEventListener('click', close);
document.getElementById('more').addEventListener('click', function(){
  var p = document.getElementById('panel');
  var open = p.classList.toggle('on');
  this.textContent = open ? 'BACK' : 'SEE MORE';
});
document.getElementById('again').addEventListener('click', function(){
  location.reload();     // ponytail: the page is self-contained, so a reload
});                      // replays it exactly. Ceiling: loses nothing, holds nothing.
document.addEventListener('keydown', function(e){
  if (e.key === 'Escape') close();
  if (e.key === 'r' || e.key === 'R') location.reload();
});
})();
</script>
